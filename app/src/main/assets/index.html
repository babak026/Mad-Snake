<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Mad Snake</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="device">
      <div class="bar">
        <span>SCORE <b id="sc">0</b></span
        ><span>MAD SNAKE</span><span>HI <b id="hi">0</b></span>
      </div>
      <div class="screen">
        <canvas
          id="c"
          width="400"
          height="400"
          aria-label="Snake game board"
        ></canvas>
      </div>
      <div class="pad" aria-label="Controls">
        <button class="u" data-d="U" aria-label="Up">▲</button>
        <button class="l" data-d="L" aria-label="Left">◀</button>
        <button class="d" data-d="D" aria-label="Down">▼</button>
        <button class="r" data-d="R" aria-label="Right">▶</button>
      </div>
      <div class="hint">
        Arrows / WASD to steer · Space to pause · Swipe on touch · Walls wrap
        around · It gets madder as you eat
      </div>
    </div>
    <script src="./js/script.js"></script>
  </body>
</html>
